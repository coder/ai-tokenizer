name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format --check

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build --dts=false

      - name: Check that the sdk fails clearly without ai
        run: node scripts/check-sdk-without-ai.mjs

      - name: Build with type declarations
        run: bun run build

      - name: Check packed types
        run: bun scripts/check-package-types.ts

  sdk-matrix:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List AI SDK cells
        id: cells
        run: echo "cells=$(scripts/test-sdk-matrix.sh --list-json)" >> "$GITHUB_OUTPUT"

  sdk-compat:
    name: sdk (ai@${{ matrix.ai }}, zod@${{ matrix.zod }}, node ${{ matrix.node }})
    needs: sdk-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-matrix.outputs.cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test the sdk against this AI SDK and zod
        run: scripts/test-sdk-matrix.sh "${{ matrix.ai }}" "${{ matrix.zod }}"
